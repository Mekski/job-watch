<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}job-watch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div class="brand">
        <span class="brand-mark">●</span>
        <span class="brand-text">job-watch</span>
      </div>
      <nav class="top-nav">
        <a href="{{ url_for('index') }}"
           class="{% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('tutorials') }}"
           class="{% if request.endpoint == 'tutorials' %}active{% endif %}">Tutorials</a>
        <a href="https://github.com/Mekski/job-watch" target="_blank" class="external">Source ↗</a>
      </nav>
    </div>
  </header>

  {% block main %}{% endblock %}

  <footer class="page-footer">
    read-only · localhost only
  </footer>
</body>
</html>
